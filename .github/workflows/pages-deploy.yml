name: Deploy Static Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Static Dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull and bundle latest live snapshots from data-state branch
        run: |
          git fetch origin data-state || true
          if git ls-remote --exit-code --heads origin data-state; then
            echo "Pulling latest snapshots from data-state branch..."
            mkdir -p /tmp/data-state-extract
            git archive origin/data-state | tar -x -C /tmp/data-state-extract || true
            mkdir -p frontend/public/data-state
            if compgen -G "/tmp/data-state-extract/*.json" > /dev/null; then
              cp -v /tmp/data-state-extract/*.json frontend/public/data-state/
            fi
          else
            echo "data-state branch not yet deployed, using baseline public snapshots."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build Dashboard
        working-directory: frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
