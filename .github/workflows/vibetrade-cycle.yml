name: VibeTrade 15m Surveillance Cycle

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: vibetrade-state-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-cycle:
    name: Execute 15m Surveillance Cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Checkout or initialize data-state branch worktree
        env:
          PYTHONPATH: agent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data-state || true
          if git ls-remote --exit-code --heads origin data-state; then
            git worktree add data-state origin/data-state
          else
            echo "Branch data-state not found. Initializing clean experiment T0 state..."
            mkdir -p /tmp/init-state
            python -m src.vibetrade.cli init-experiment --state-dir /tmp/init-state
            git checkout --orphan data-state
            git rm -rf .
            cp -v /tmp/init-state/*.json .
            git add -A
            git commit --allow-empty -m "chore(data-state): initialize clean T0 experiment state [skip ci]"
            git push origin data-state
            git checkout -f main
            git worktree add data-state origin/data-state
          fi

      - name: Run VibeTrade Surveillance Cycle
        env:
          PYTHONPATH: agent
        run: |
          python -m src.vibetrade.cli run-cycle --state-dir ./data-state

      - name: Commit and push updated snapshots to data-state
        run: |
          cd data-state
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(data-state): update 15m surveillance snapshots [skip ci]"
            git push origin data-state
          else
            echo "No state change detected; skipping commit."
          fi
